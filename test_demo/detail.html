<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>汪集市 - 商品详情</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#78350f',
              secondary: '#f5f5f4',
              accent: '#d97706',
            },
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #fafaf9;
      }
    </style>
  </head>
  <body class="text-stone-800 pb-20">
    <!-- Header -->
    <header
      class="fixed top-0 left-0 right-0 bg-white/90 backdrop-blur z-50 px-4 py-3 shadow-sm flex items-center justify-between"
    >
      <button onclick="history.back()" class="p-2 -ml-2 rounded-full hover:bg-stone-100">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6 text-stone-600"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 19l-7-7 7-7"
          />
        </svg>
      </button>
      <h1 class="font-bold text-lg text-stone-800">商品详情</h1>
      <button
        class="p-2 -mr-2 rounded-full hover:bg-stone-100"
        onclick="showToast('分享功能开发中')"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6 text-stone-600"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"
          />
        </svg>
      </button>
    </header>

    <!-- Product Image -->
    <div class="mt-14 w-full h-80 bg-stone-200 relative overflow-hidden">
      <img id="product-image" src="" alt="商品图片" class="w-full h-full object-cover" />
    </div>

    <!-- Product Info -->
    <div class="bg-white p-4 mb-3 shadow-sm">
      <div class="flex items-baseline gap-1 mb-2">
        <span class="text-xs text-accent font-bold">¥</span>
        <span id="product-price" class="text-2xl font-bold text-accent">0.00</span>
      </div>
      <h2 id="product-title" class="text-lg font-bold leading-snug mb-2">商品加载中...</h2>
      <div class="flex justify-between text-xs text-stone-400">
        <span>浏览 1024</span>
        <span>想要 12</span>
      </div>
    </div>

    <!-- Seller Info -->
    <div class="bg-white p-4 mb-3 shadow-sm flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-stone-200 overflow-hidden">
          <img
            src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix"
            alt="Seller"
            class="w-full h-full object-cover"
          />
        </div>
        <div>
          <div class="font-bold text-sm">爱宠人士小王</div>
          <div class="text-xs text-stone-500">信用极好 | 10分钟前在线</div>
        </div>
      </div>
      <button
        class="text-primary border border-primary px-3 py-1 rounded-full text-xs font-medium"
        onclick="showToast('关注成功！')"
      >
        关注
      </button>
    </div>

    <!-- Description -->
    <div class="bg-white p-4 shadow-sm min-h-[200px]">
      <h3 class="font-bold text-sm mb-2 border-l-4 border-primary pl-2">宝贝描述</h3>
      <p id="product-desc" class="text-sm text-stone-600 leading-relaxed">商品详情加载中...</p>
    </div>

    <!-- Bottom Action Bar -->
    <div
      class="fixed bottom-0 left-0 right-0 bg-white border-t border-stone-200 p-2 flex items-center gap-3 z-50 safe-area-bottom"
    >
      <div class="flex gap-4 px-2">
        <button
          class="flex flex-col items-center gap-0.5 text-stone-500"
          onclick="showToast('已加入想要列表')"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
            />
          </svg>
          <span class="text-[10px]">想要</span>
        </button>
        <button
          class="flex flex-col items-center gap-0.5 text-stone-500"
          onclick="showToast('留言功能开发中')"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
            />
          </svg>
          <span class="text-[10px]">留言</span>
        </button>
      </div>
      <button
        class="flex-1 bg-gradient-to-r from-orange-400 to-red-500 text-white font-bold py-2 rounded-full shadow-lg"
        onclick="showToast('正在发起交易...')"
      >
        我想要
      </button>
    </div>

    <script>
      // Simple logic to fill data from URL params
      document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search)
        const id = params.get('id')
        const title = params.get('title')
        const price = params.get('price')
        const img = params.get('img')

        if (title) document.getElementById('product-title').innerText = decodeURIComponent(title)
        if (price) document.getElementById('product-price').innerText = price
        if (img) document.getElementById('product-image').src = decodeURIComponent(img)

        // Generate some random description based on ID
        document.getElementById('product-desc').innerText =
          `这是编号为 #${id || '000'} 的宝贝。这件宝贝非常适合家里的毛孩子，九成新，原价购入，因为家里主子不喜欢所以低价转让。支持同城自提，也支持快递包邮。诚心要的来，手慢无！`
      })
    </script>
    <script src="toast.js"></script>
  </body>
</html>
