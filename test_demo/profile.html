<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>汪集市 - 我的</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#78350f',
                        secondary: '#f5f5f4',
                        accent: '#d97706',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #fafaf9; }
    </style>
</head>
<body class="text-stone-800 pb-20">

    <!-- Header / Profile Card -->
    <header class="bg-white pt-10 pb-6 px-4 mb-3">
        <div class="flex items-center gap-4 mb-6">
            <div class="w-16 h-16 rounded-full bg-stone-200 overflow-hidden border-2 border-white shadow-sm">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Ginger" alt="My Avatar" class="w-full h-full object-cover">
            </div>
            <div>
                <h1 class="font-bold text-xl mb-1">铲屎官阿强</h1>
                <div class="text-xs text-stone-500 bg-stone-100 inline-block px-2 py-0.5 rounded-full">
                    信用分: 780
                </div>
            </div>
            <div class="ml-auto text-stone-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </div>
        </div>

        <div class="flex justify-around text-center">
            <div>
                <div class="font-bold text-lg">12</div>
                <div class="text-xs text-stone-500">超赞</div>
            </div>
            <div>
                <div class="font-bold text-lg">5</div>
                <div class="text-xs text-stone-500">关注</div>
            </div>
            <div>
                <div class="font-bold text-lg">28</div>
                <div class="text-xs text-stone-500">粉丝</div>
            </div>
        </div>
    </header>

    <!-- My Orders / Selling -->
    <div class="bg-white rounded-lg mx-3 mb-3 p-4 shadow-sm">
        <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-sm">我的交易</h2>
            <span class="text-xs text-stone-400 flex items-center">
                查看全部 
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </span>
        </div>
        <div class="flex justify-between text-center">
            <div class="flex flex-col items-center gap-2">
                <div class="text-2xl">📦</div>
                <span class="text-xs text-stone-600">我发布的</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="text-2xl">💰</div>
                <span class="text-xs text-stone-600">我卖出的</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="text-2xl">🛍️</div>
                <span class="text-xs text-stone-600">我买到的</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div class="text-2xl">❤️</div>
                <span class="text-xs text-stone-600">我想要的</span>
            </div>
        </div>
    </div>

    <!-- More Tools -->
    <div class="bg-white rounded-lg mx-3 mb-3 shadow-sm overflow-hidden">
        <div class="flex items-center justify-between p-4 border-b border-stone-50 hover:bg-stone-50 cursor-pointer">
            <div class="flex items-center gap-3">
                <span class="text-lg">👛</span>
                <span class="text-sm font-medium">我的钱包</span>
            </div>
            <span class="text-xs text-stone-400">¥ 102.50</span>
        </div>
        <div class="flex items-center justify-between p-4 border-b border-stone-50 hover:bg-stone-50 cursor-pointer">
            <div class="flex items-center gap-3">
                <span class="text-lg">📍</span>
                <span class="text-sm font-medium">收货地址</span>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-stone-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </div>
        <div class="flex items-center justify-between p-4 hover:bg-stone-50 cursor-pointer">
            <div class="flex items-center gap-3">
                <span class="text-lg">⚙️</span>
                <span class="text-sm font-medium">设置</span>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-stone-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </div>
    </div>

    <!-- Bottom Navbar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-stone-200 py-2 px-6 flex justify-between items-center z-50">
        <a href="index.html" class="flex flex-col items-center gap-1 text-stone-400 hover:text-primary transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <span class="text-[10px] font-medium">首页</span>
        </a>
        <a href="chat.html" class="flex flex-col items-center gap-1 text-stone-400 hover:text-primary transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
            </svg>
            <span class="text-[10px] font-medium">消息</span>
        </a>
        <a href="profile.html" class="flex flex-col items-center gap-1 text-primary">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
            </svg>
            <span class="text-[10px] font-medium">我的</span>
        </a>
    </nav>

</body>
</html>
